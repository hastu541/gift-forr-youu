<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link rel="stylesheet" href="style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<div class="bg-gradient"></div>
<div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
</div>

<canvas id="heartCanvas"></canvas>
<div class="sparkle-container" id="sparkleContainer"></div>

<div id="app">

    <!-- PAGE 1 -->
    <div class="page active" id="page1">
        <div class="page-content">
            <div class="glass-card main-card">

                <h1 class="title-main" id="mainQuestion">
                    Will you be my Valentine?
                </h1>

                <p class="subtitle" id="subQuestion">
                    Please say yes
                </p>

                <div class="button-group">
                    <button class="btn btn-yes" id="yesBtn">
                        <span class="btn-text">YES</span>
                        <span class="btn-shine"></span>
                    </button>

                    <button class="btn btn-no" id="noBtn">
                        <span class="btn-text">NO</span>
                        <span class="btn-shine"></span>
                    </button>
                </div>

                <p class="escape-text hidden" id="noEscapeText"></p>

            </div>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
